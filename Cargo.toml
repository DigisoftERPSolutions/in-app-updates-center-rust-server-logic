[package]
name = "logic"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow     = "1.0"
axum       = { version = "0.8", features = ["macros", "multipart"] }
dotenvy    = "0.15"
serde      = { version = "1.0", features = ["derive"] }
jsonwebtoken = "9"

serde_json = "1.0"
# Outbound call to the Anthropic Messages API for the meter-OCR cloud
# fallback (see src/meter_ocr) — rustls to match sqlx's TLS stack rather
# than pulling in a second (openssl-backed) TLS implementation.
reqwest    = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64     = "0.22"
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono"
] }
tokio      = { version = "1",   features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "catch-panic"] }
tracing          = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bcrypt     = "0.16"     # for password hashing
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4.45", features = ["clock","serde"] }
